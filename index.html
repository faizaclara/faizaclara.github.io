<!DOCTYPE html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil Faiza Clara Vimanda</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.15);
      padding: 40px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      transition: transform 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    /* Foto Profil */
    .profile-pic {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #66a6ff;
      margin-bottom: 20px;
    }

    /* Nama dan biodata */
    h2 {
      margin: 10px 0 5px;
      font-size: 26px;
      color: #333;
    }

    .info {
      color: #555;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    /* Bagian ikon sosial media */
    .social-links {
      display: flex;
      justify-content: center;
      gap: 30px;
    }

    .social-links a svg {
      width: 50px;
      height: 50px;
      transition: transform 0.3s;
    }

    .social-links a:hover svg {
      transform: scale(1.2);
    }

    .social-links .instagram svg:hover {
      filter: drop-shadow(0 0 5px #e4405f);
    }

    .social-links .github svg:hover {
      filter: drop-shadow(0 0 5px #333);
    }
  </style>
</head>
